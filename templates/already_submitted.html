<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already Submitted - BBSUL Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-16">
        <div class="bg-white rounded-xl shadow-md p-8 text-center">
            <div class="flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mx-auto mb-6">
                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-4">Form Already Submitted</h1>
            <p class="text-gray-600 mb-6">
                Dear {{ student.full_name }}, you have already submitted your student information form.
                Only one submission per student is allowed.
            </p>
            <div class="space-y-4">
                <a href="{{ url_for('student_logout') }}"
                   class="block w-full bg-purple-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-purple-700 transition-colors">
                    Logout
                </a>
            </div>
        </div>
    </div>
</body>
</html>
